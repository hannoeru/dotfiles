name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Eval-only: catches broken flake outputs for every system without building.
      - run: nix flake check --all-systems --no-build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix fmt -- --ci

  home:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: -aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix build --no-link ".#homeConfigurations.ephemeral${{ matrix.suffix }}.activationPackage"
      - run: nix build --no-link ".#homeConfigurations.hanlee@ubuntu${{ matrix.suffix }}.activationPackage"
      - run: |
          activation_script="$(mktemp)"
          nix eval --raw --no-write-lock-file ".#homeConfigurations.hanlee@ubuntu${{ matrix.suffix }}.config.home.activation.signingKey.data" > "$activation_script"
          python3 scripts/test-signing-key.py "$activation_script"

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix build --no-link .#darwinConfigurations.Han-MBP.system
      - run: nix build --no-link .#darwinConfigurations.work.system
